*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#0f172a;color:#e2e8f0;overflow:hidden;user-select:none}
#header{position:fixed;top:0;left:0;right:0;height:56px;background:linear-gradient(135deg,#1e40af,#1e3a8a);display:flex;align-items:center;padding:0 20px;z-index:100;box-shadow:0 4px 12px #0008}
#header h1{font-size:20px;color:#fff;font-weight:700;letter-spacing:-0.5px}
#header .sub{margin-left:12px;font-size:12px;color:#60a5fa;font-weight:400}
#controls{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{padding:6px 14px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#cbd5e1;cursor:pointer;font-size:12px;font-family:inherit;transition:all.2s}
.btn:hover{background:#334155;color:#fff;border-color:#475569}
#legend{position:fixed;top:64px;right:12px;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px 16px;z-index:99;font-size:11px;min-width:160px;max-height:80vh;overflow-y:auto}
#legend h3{font-size:11px;color:#60a5fa;margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.leg-item{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
#canvas{position:fixed;top:56px;left:0;right:0;bottom:0;cursor:grab}
#canvas:active{cursor:grabbing}
svg{width:100%;height:100%}
.table-card{cursor:grab}
.table-card:active{cursor:grabbing}
.col-row{transition:fill.15s}
.col-row:hover{fill:#2a3f5f!important}
#tooltip{position:fixed;background:#1e293b;border:1px solid #475569;border-radius:8px;padding:10px 14px;font-size:11px;pointer-events:none;display:none;z-index:200;max-width:320px;line-height:1.7;font-family:Consolas,'Courier New',monospace}
#tooltip code{color:#a78bfa;background:#0f172a;padding:2px 4px;border-radius:3px}
</style>
</head>

  ['incident_inquiry','inquiry','inquiry_id FK','#10b981'],
  ['security_event_history','security_event','security_event_id FK','#f59e0b'],
  ['security_analysis','security_event','security_event_id FK','#f59e0b'],
  ['security_alert','security_event','security_event_id FK','#f59e0b'],
];

const TBL_W = 280, ROW_H = 16, HDR_H = 44, PADDING = 2;

let vx=40, vy=30, scale=0.7, dragging=false, dragEl=null;
let startX=0, startY=0, startVX=0, startVY=0, dragTX=0, dragTY=0;
let positions = {};
TABLES.forEach(t => { positions[t.id] = {x:t.x, y:t.y}; });

const svg = document.getElementById('svg');
const root = document.getElementById('root');
const relsG = document.getElementById('rels');
const tablesG = document.getElementById('tables');
const tooltip = document.getElementById('tooltip');

function getTableHeight(t){ return HDR_H + t.cols.length * ROW_H + PADDING*2; }

function getCBadge(c){
  const badges=[];
  if(c.includes('PK')) badges.push({lbl:'PK',col:'#f59e0b'});
  if(c.includes('FK')) badges.push({lbl:'FK',col:'#10b981'});
  if(c.includes('AI')) badges.push({lbl:'AI',col:'#a78bfa'});
  if(c.includes('UQ')) badges.push({lbl:'UQ',col:'#38bdf8'});
  if(c.includes('NN')) badges.push({lbl:'NN',col:'#ef4444'});
  return badges;
}

function render(){
  relsG.innerHTML=''; tablesG.innerHTML='';

  RELS.forEach(([from,to,lbl,col])=>{
    const fp=positions[from], tp=positions[to];
    const ft=TABLES.find(t=>t.id===from), tt=TABLES.find(t=>t.id===to);
    if(!fp||!tp||!ft||!tt) return;
    const x1=fp.x+TBL_W/2, y1=fp.y+getTableHeight(ft)/2;
    const x2=tp.x+TBL_W/2, y2=tp.y+getTableHeight(tt)/2;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    const dx=Math.abs(x2-x1)*0.3;
    path.setAttribute('d',`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`);
    path.setAttribute('stroke',col);
    path.setAttribute('stroke-width','1.2');
    path.setAttribute('fill','none');
    path.setAttribute('opacity','0.6');
    path.setAttribute('marker-end','url(#arrow)');
    relsG.appendChild(path);
  });

  TABLES.forEach(t=>{
    const pos=positions[t.id];
    const h=getTableHeight(t);
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','table-card');
    g.setAttribute('transform',`translate(${pos.x},${pos.y})`);
    g.setAttribute('data-id',t.id);
    g.setAttribute('filter','url(#shadow)');

    const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
    bg.setAttribute('width',TBL_W);
    bg.setAttribute('height',h);
    bg.setAttribute('rx','8');
    bg.setAttribute('fill','#1e293b');
    bg.setAttribute('stroke',t.cat);
    bg.setAttribute('stroke-width','1.5');
    g.appendChild(bg);

    const hdr=document.createElementNS('http://www.w3.org/2000/svg','rect');
    hdr.setAttribute('width',TBL_W);
    hdr.setAttribute('height',HDR_H);
    hdr.setAttribute('rx','8');
    hdr.setAttribute('fill',t.hdr);
    g.appendChild(hdr);

    const hdr2=document.createElementNS('http://www.w3.org/2000/svg','rect');
    hdr2.setAttribute('width',TBL_W);
    hdr2.setAttribute('height','10');
    hdr2.setAttribute('y',HDR_H-10);
    hdr2.setAttribute('fill',t.hdr);
    g.appendChild(hdr2);

    const lines=t.label.split('\n');
    lines.forEach((line,i)=>{
      const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
      txt.setAttribute('x',TBL_W/2);
      txt.setAttribute('y', lines.length===1 ? HDR_H/2+3 : 10 + i*12);
      txt.setAttribute('fill','#ffffff');
      txt.setAttribute('font-size', i===0?'11':'9');
      txt.setAttribute('font-weight', i===0?'700':'400');
      txt.setAttribute('font-family','Malgun Gothic,sans-serif');
      txt.setAttribute('text-anchor','middle');
      txt.setAttribute('dominant-baseline','middle');
      txt.textContent=line;
      g.appendChild(txt);
    });

    const sep=document.createElementNS('http://www.w3.org/2000/svg','line');
    sep.setAttribute('x1','0');
    sep.setAttribute('y1',HDR_H);
    sep.setAttribute('x2',TBL_W);
    sep.setAttribute('y2',HDR_H);
    sep.setAttribute('stroke',t.cat);
    sep.setAttribute('stroke-width','1');
    g.appendChild(sep);

    t.cols.forEach((col,ci)=>{
      const ry=HDR_H + PADDING + ci*ROW_H;
      const rbg=document.createElementNS('http://www.w3.org/2000/svg','rect');
      rbg.setAttribute('x','0');
      rbg.setAttribute('y',ry);
      rbg.setAttribute('width',TBL_W);
      rbg.setAttribute('height',ROW_H);
      rbg.setAttribute('fill', ci%2===0?'#1e293b':'#0f172a');
      rbg.setAttribute('class','col-row');
      g.appendChild(rbg);

      const cn=document.createElementNS('http://www.w3.org/2000/svg','text');
      cn.setAttribute('x','6');
      cn.setAttribute('y',ry+ROW_H/2);
      cn.setAttribute('fill', col.c.includes('PK')?'#fbbf24': col.c.includes('FK')?'#34d399':'#cbd5e1');
      cn.setAttribute('font-size','9');
      cn.setAttribute('font-family','Consolas,monospace');
      cn.setAttribute('dominant-baseline','middle');
      cn.setAttribute('font-weight', col.c.includes('PK')||col.c.includes('FK')?'700':'400');
      cn.textContent=col.n;
      g.appendChild(cn);

      const ct=document.createElementNS('http://www.w3.org/2000/svg','text');
      ct.setAttribute('x',TBL_W-90);
      ct.setAttribute('y',ry+ROW_H/2);
      ct.setAttribute('fill','#64748b');
      ct.setAttribute('font-size','7');
      ct.setAttribute('font-family','Consolas,monospace');
      ct.setAttribute('dominant-baseline','middle');
      ct.textContent=col.t.substring(0,18);
      g.appendChild(ct);

      const badges=getCBadge(col.c);
      let bx=TBL_W-4;
      badges.slice(0,2).reverse().forEach(b=>{
        bx-=14;
        const br=document.createElementNS('http://www.w3.org/2000/svg','rect');
        br.setAttribute('x',bx);
        br.setAttribute('y',ry+1);
        br.setAttribute('width','12');
        br.setAttribute('height','10');
        br.setAttribute('rx','1.5');
        br.setAttribute('fill',b.col);
        br.setAttribute('opacity','0.2');
        g.appendChild(br);
        const bt=document.createElementNS('http://www.w3.org/2000/svg','text');
        bt.setAttribute('x',bx+6);
        bt.setAttribute('y',ry+ROW_H/2);
        bt.setAttribute('fill',b.col);
        bt.setAttribute('font-size','6');
        bt.setAttribute('font-family','Consolas,monospace');
        bt.setAttribute('text-anchor','middle');
        bt.setAttribute('dominant-baseline','middle');
        bt.setAttribute('font-weight','700');
        bt.textContent=b.lbl;
        g.appendChild(bt);
      });

      if(ci < t.cols.length-1){
        const sl=document.createElementNS('http://www.w3.org/2000/svg','line');
        sl.setAttribute('x1','0');
        sl.setAttribute('y1',ry+ROW_H);
        sl.setAttribute('x2',TBL_W);
        sl.setAttribute('y2',ry+ROW_H);
        sl.setAttribute('stroke','#1e3a5f');
        sl.setAttribute('stroke-width','0.5');
        g.appendChild(sl);
      }

      const ov=document.createElementNS('http://www.w3.org/2000/svg','rect');
      ov.setAttribute('x','0');
      ov.setAttribute('y',ry);
      ov.setAttribute('width',TBL_W);
      ov.setAttribute('height',ROW_H);
      ov.setAttribute('fill','transparent');
      ov.addEventListener('mouseenter',e=>{
        tooltip.style.display='block';
        const constr = col.c ? col.c.split('·').join(', ') : '없음';
        tooltip.innerHTML=`<b style="color:#fbbf24">${t.id}.${col.n}</b><br>
          <code>${col.t}</code><br>
          제약: ${constr}<br>
          <span style="color:#94a3b8">${col.note}</span>`;
      });
      ov.addEventListener('mousemove',e=>{
        tooltip.style.left=(e.clientX+12)+'px';
        tooltip.style.top=(e.clientY+8)+'px';
      });
      ov.addEventListener('mouseleave',()=>{tooltip.style.display='none';});
      g.appendChild(ov);
    });

    g.addEventListener('mousedown',e=>{
      e.stopPropagation();
      dragging=true;
      dragEl=t.id;
      dragTX=positions[t.id].x;
      dragTY=positions[t.id].y;
      startX=e.clientX;
      startY=e.clientY;
    });

    tablesG.appendChild(g);
  });

  root.setAttribute('transform',`translate(${vx},${vy}) scale(${scale})`);
}

svg.addEventListener('mousedown',e=>{
  if(dragEl) return;
  dragging=true;
  dragEl=null;
  startX=e.clientX;
  startY=e.clientY;
  startVX=vx;
  startVY=vy;
});

document.addEventListener('mousemove',e=>{
  if(!dragging) return;
  if(dragEl){
    const dx=(e.clientX-startX)/scale, dy=(e.clientY-startY)/scale;
    positions[dragEl].x=dragTX+dx;
    positions[dragEl].y=dragTY+dy;
    render();
  } else {
    vx=startVX+(e.clientX-startX);
    vy=startVY+(e.clientY-startY);
    root.setAttribute('transform',`translate(${vx},${vy}) scale(${scale})`);
  }
});

document.addEventListener('mouseup',()=>{ dragging=false; dragEl=null; });

svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const delta=e.deltaY>0?0.9:1.1;
  const rect=svg.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  vx=(vx-mx)*delta+mx;
  vy=(vy-my)*delta+my;
  scale*=delta;
  scale=Math.max(0.2,Math.min(3,scale));
  document.getElementById('zoomLabel').textContent=Math.round(scale*100)+'%';
  root.setAttribute('transform',`translate(${vx},${vy}) scale(${scale})`);
});

function resetView(){ vx=40; vy=30; scale=0.7; document.getElementById('zoomLabel').textContent=Math.round(scale*100)+'%'; render(); }
function zoomIn(){ scale=Math.min(3,scale*1.2); document.getElementById('zoomLabel').textContent=Math.round(scale*100)+'%'; render(); }
function zoomOut(){ scale=Math.max(0.2,scale*0.8); document.getElementById('zoomLabel').textContent=Math.round(scale*100)+'%'; render(); }

resetView();
</script>
</body>
</html>
